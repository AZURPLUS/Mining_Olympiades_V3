services:
  app:
    build:
      context: .
    container_name: ${PROJECT_NAME}_app
    volumes:
      - ./public:/var/www/symfony/public
      - ./src:/var/www/symfony/src
      - ./templates:/var/www/symfony/templates
      - ./migrations:/var/www/symfony/migrations
      - ./var:/var/www/symfony/var
      - /var/lib/php/sessions:/var/lib/php/sessions
    environment:
      APP_ENV: dev
    networks:
      - symfony_network
    depends_on:
      - db
      - redis           # Ajout de la dépendance sur redis
    ports:
      - "8000:80"

  db:
    image: mariadb:10.11
    container_name: ${PROJECT_NAME}_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${PROJECT_USER}
      MYSQL_PASSWORD: ${PROJECT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - symfony_network

  nginx:
    image: nginx:alpine
    container_name: ${PROJECT_NAME}_nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs
      - ./public:/var/www/symfony/public
    ports:
      - "80:80"
      - "443:443"
    networks:
      - symfony_network
    depends_on:
      - app

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ${PROJECT_NAME}_phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8080:80"
    networks:
      - symfony_network
  redis:                           # Nouveau service Redis
    image: redis:latest
    container_name: ${PROJECT_NAME}_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - symfony_network

volumes:
  db_data:
  certs:

networks:
  symfony_network:
    driver: bridge
