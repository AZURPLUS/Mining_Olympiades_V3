server {
    listen 80;
    server_name kani-educ.com www.kani-educ.com;

    # Redirection HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kani-educ.com www.kani-educ.com;

    root /var/www/symfony/public;
    index index.php index.html;
    client_max_body_size 100M;

    # SSL Configuration (remplacer par les certificats Let's Encrypt ou officiels)
    ssl_certificate /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;

    # Sécurité SSL (production)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # HSTS (oblige l'utilisation de HTTPS, attention en dev !)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Cache static files
    location ~* \.(?:css|js|gif|jpe?g|png|woff2?|eot|ttf|otf|svg|ico)$ {
        root /var/www/symfony/public;
        expires 6M;
        access_log off;
        log_not_found off;
    }

    # Application Symfony
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000; # ou unix:/var/run/php/php8.2-fpm.sock si sans Docker
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
    }

    # Sécurité supplémentaire
    location ~ /\.ht {
        deny all;
    }
}
